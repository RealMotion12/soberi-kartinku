name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q soberi-kartinku-android.zip -d project

      - name: Configure Android project
        working-directory: project
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.realmotion12.soberikartinku"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.realmotion12.soberikartinku"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 3
                  versionName = "3.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)

              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          EOF

      - name: Replace game
        working-directory: project
        run: |
          mkdir -p app/src/main/java/com/realmotion12/soberikartinku

          cat > app/src/main/java/com/realmotion12/soberikartinku/MainActivity.kt <<'EOF'
          package com.realmotion12.soberikartinku

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var root: LinearLayout

              private var money = 1000
              private var vehicles = 1
              private var employees = 1
              private var orders = 0
              private var reputation = 74
              private var business = "Доставка"

              private val prefs by lazy {
                  getSharedPreferences("micro_empire", MODE_PRIVATE)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  loadGame()
                  showMainMenu()
              }

              private fun loadGame() {
                  money = prefs.getInt("money", 1000)
                  vehicles = prefs.getInt("vehicles", 1)
                  employees = prefs.getInt("employees", 1)
                  orders = prefs.getInt("orders", 0)
                  reputation = prefs.getInt("reputation", 74)
                  business = prefs.getString("business", "Доставка") ?: "Доставка"
              }

              private fun saveGame() {
                  prefs.edit()
                      .putInt("money", money)
                      .putInt("vehicles", vehicles)
                      .putInt("employees", employees)
                      .putInt("orders", orders)
                      .putInt("reputation", reputation)
                      .putString("business", business)
                      .apply()
              }

              private fun baseLayout(): LinearLayout {
                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(24, 24, 24, 24)
                  layout.setBackgroundColor(Color.rgb(7, 18, 32))
                  return layout
              }

              private fun title(text: String): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = 27f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(0, 20, 0, 20)
                  }
              }

              private fun subtitle(text: String): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = 15f
                      setTextColor(Color.rgb(160, 180, 200))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }
              }

              private fun button(
                  text: String,
                  action: () -> Unit
              ): Button {
                  return Button(this).apply {
                      this.text = text
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setOnClickListener { action() }

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          60
                      ).apply {
                          setMargins(0, 6, 0, 6)
                      }
                  }
              }

              private fun card(text: String): TextView {
                  return TextView(this).apply {
                      this.text = text
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(20, 36, 55))
                      setPadding(20, 20, 20, 20)

                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 5, 0, 5)
                      }
                  }
              }

              private fun showMainMenu() {
                  root = baseLayout()

                  root.addView(title("👑 МИКРО ИМПЕРИЯ"))
                  root.addView(
                      subtitle(
                          "Построй свой бизнес\nНачни с малого — стань лидером"
                      )
                  )

                  root.addView(
                      button("▶ НАЧАТЬ ИГРУ") {
                          showBusinessSelection()
                      }
                  )

                  root.addView(
                      button("💼 ПРОДОЛЖИТЬ") {
                          showDashboard()
                      }
                  )

                  root.addView(
                      button("⚙ НАСТРОЙКИ") {
                          Toast.makeText(
                              this,
                              "Настройки появятся в следующей версии",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  )

                  setContentView(root)
              }

              private fun showBusinessSelection() {
                  root = baseLayout()

                  root.addView(title("ВЫБЕРИ СВОЙ БИЗНЕС"))
                  root.addView(
                      subtitle("Выбери направление для своей компании")
                  )

                  root.addView(
                      button("🚕 ТАКСИ\nПеревозка пассажиров") {
                          startBusiness("Такси")
                      }
                  )

                  root.addView(
                      button("🛵 ДОСТАВКА\nЕда и товары") {
                          startBusiness("Доставка")
                      }
                  )

                  root.addView(
                      button("🍔 РЕСТОРАН\nСоздание собственной сети") {
                          startBusiness("Ресторан")
                      }
                  )

                  root.addView(
                      button("🚗 ПРОКАТ АВТО\nАренда автомобилей") {
                          startBusiness("Прокат авто")
                      }
                  )

                  root.addView(
                      button("📦 КУРЬЕРСКАЯ СЛУЖБА\nЛогистика и доставка") {
                          startBusiness("Курьерская служба")
                      }
                  )

                  root.addView(
                      button("← НАЗАД") {
                          showMainMenu()
                      }
                  )

                  setContentView(root)
              }

              private fun startBusiness(type: String) {
                  business = type
                  money = 1000
                  vehicles = 1
                  employees = 1
                  orders = 0
                  reputation = 74

                  saveGame()
                  showDashboard()
              }

              private fun showDashboard() {
                  root = baseLayout()

                  val scroll = ScrollView(this)

                  val content = baseLayout()

                  content.addView(title("МОЯ КОМПАНИЯ"))

                  content.addView(
                      card(
                          "🏢 $business\n" +
                          "📍 Ирбид\n\n" +
                          "💰 Деньги: $money\n" +
                          "🚗 Транспорт: $vehicles\n" +
                          "👨‍💼 Сотрудники: $employees\n" +
                          "📦 Заказов выполнено: $orders\n" +
                          "⭐ Репутация: $reputation%"
                      )
                  )

                  content.addView(
                      button("📦 ПОЛУЧИТЬ ЗАКАЗ") {
                          takeOrder()
                      }
                  )

                  content.addView(
                      button("🚗 МОЙ ТРАНСПОРТ") {
                          showVehicles()
                      }
                  )

                  content.addView(
                      button("👨‍💼 СОТРУДНИКИ") {
                          showEmployees()
                      }
                  )

                  content.addView(
                      button("📈 РАЗВИТИЕ") {
                          showDevelopment()
                      }
                  )

                  content.addView(
                      button("💾 СОХРАНИТЬ") {
                          saveGame()

                          Toast.makeText(
                              this,
                              "Игра сохранена",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                  )

                  content.addView(
                      button("🏠 ГЛАВНОЕ МЕНЮ") {
                          saveGame()
                          showMainMenu()
                      }
                  )

                  scroll.addView(content)
                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  setContentView(root)
              }

              private fun takeOrder() {
                  val baseIncome = when (business) {
                      "Такси" -> 35
                      "Доставка" -> 25
                      "Ресторан" -> 45
                      "Прокат авто" -> 55
                      else -> 30
                  }

                  val income = baseIncome + employees * 5

                  money += income
                  orders++

                  if (reputation < 100) {
                      reputation++
                  }

                  saveGame()
                  showDashboard()

                  Toast.makeText(
                      this,
                      "Заказ выполнен! +$income 💰",
                      Toast.LENGTH_SHORT
                  ).show()
              }

              private fun showVehicles() {
                  root = baseLayout()

                  root.addView(title("🚗 МОЙ ТРАНСПОРТ"))
                  root.addView(
                      subtitle("Транспорт увеличивает возможности компании")
                  )

                  root.addView(
                      card(
                          "🛵 Скутер 50cc\n" +
                          "Цена: 500\n" +
                          "Доход: +20 за заказ\n" +
                          "У тебя: $vehicles"
                      )
                  )

                  root.addView(
                      button("КУПИТЬ СКУТЕР — 500 💰") {
                          if (money >= 500) {
                              money -= 500
                              vehicles++
                              saveGame()
                              showVehicles()

                              Toast.makeText(
                                  this,
                                  "Скутер куплен!",
                                  Toast.LENGTH_SHORT
                              ).show()
                          } else {
                              Toast.makeText(
                                  this,
                                  "Недостаточно денег",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  )

                  root.addView(
                      card(
                          "🚗 Автомобиль\n" +
                          "Цена: 5000\n" +
                          "Доход: +120 за заказ"
                      )
                  )

                  root.addView(
                      button("КУПИТЬ АВТОМОБИЛЬ — 5000 💰") {
                          if (money >= 5000) {
                              money -= 5000
                              vehicles++
                              saveGame()
                              showVehicles()
                          } else {
                              Toast.makeText(
                                  this,
                                  "Недостаточно денег",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  )

                  root.addView(
                      button("← НАЗАД") {
                          showDashboard()
                      }
                  )

                  setContentView(root)
              }

              private fun showEmployees() {
                  root = baseLayout()

                  root.addView(title("👨‍💼 СОТРУДНИКИ"))

                  root.addView(
                      card(
                          "👨‍✈️ Курьеры\n" +
                          "Зарплата: 300 💰\n" +
                          "Количество: $employees"
                      )
                  )

                  root.addView(
                      button("НАНЯТЬ КУРЬЕРА — 300 💰") {
                          if (money >= 300) {
                              money -= 300
                              employees++
                              saveGame()
                              showEmployees()

                              Toast.makeText(
                                  this,
                                  "Новый сотрудник нанят!",
                                  Toast.LENGTH_SHORT
                              ).show()
                          } else {
                              Toast.makeText(
                                  this,
                                  "Недостаточно денег",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  )

                  root.addView(
                      card(
                          "📊 Производительность\n\n" +
                          "Скорость: ${minOf(100, 50 + employees * 5)}%\n" +
                          "Качество: $reputation%\n" +
                          "Активных сотрудников: $employees"
                      )
                  )

                  root.addView(
                      button("← НАЗАД") {
                          showDashboard()
                      }
                  )

                  setContentView(root)
              }

              private fun showDevelopment() {
                  root = baseLayout()

                  root.addView(title("📈 РАЗВИТИЕ"))

                  root.addView(
                      card(
                          "💰 Капитал: $money\n" +
                          "📦 Заказы: $orders\n" +
                          "🚗 Транспорт: $vehicles\n" +
                          "👨‍💼 Сотрудники: $employees\n" +
                          "⭐ Репутация: $reputation%"
                      )
                  )

                  root.addView(
                      button("📣 РЕКЛАМА — 250 💰") {
                          if (money >= 250) {
                              money -= 250
                              reputation = minOf(100, reputation + 5)
                              saveGame()
                              showDevelopment()

                              Toast.makeText(
                                  this,
                                  "Реклама привлекла клиентов!",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  )

                  root.addView(
                      button("🔧 УЛУЧШИТЬ СЕРВИС — 500 💰") {
                          if (money >= 500) {
                              money -= 500
                              reputation = minOf(100, reputation + 10)
                              saveGame()
                              showDevelopment()

                              Toast.makeText(
                                  this,
                                  "Качество сервиса улучшено!",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  )

                  root.addView(
                      button("🏢 ОТКРЫТЬ ФИЛИАЛ — 5000 💰") {
                          if (money >= 5000) {
                              money -= 5000
                              vehicles += 2
                              employees += 2
                              reputation = minOf(100, reputation + 5)
                              saveGame()

                              Toast.makeText(
                                  this,
                                  "🎉 Новый филиал открыт!",
                                  Toast.LENGTH_LONG
                              ).show()

                              showDevelopment()
                          } else {
                              Toast.makeText(
                                  this,
                                  "Для филиала нужно 5000 💰",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  )

                  root.addView(
                      button("← НАЗАД") {
                          showDashboard()
                      }
                  )

                  setContentView(root)
              }
          }
          EOF

      - name: Check Gradle environment
        working-directory: project
        run: |
          java -version
          gradle --version

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Micro-Empire-APK
          path: project/app/build/outputs/apk/debug/*.apk
