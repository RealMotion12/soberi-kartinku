name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q soberi-kartinku-android.zip -d project

      - name: Fix JVM compatibility
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'sourceCompatibility = JavaVersion.VERSION_17',
              'sourceCompatibility = JavaVersion.VERSION_1_8'
          )

          s = s.replace(
              'targetCompatibility = JavaVersion.VERSION_17',
              'targetCompatibility = JavaVersion.VERSION_1_8'
          )

          s = s.replace(
              'jvmTarget = "17"',
              'jvmTarget = "1.8"'
          )

          p.write_text(s)

          print("===== FINAL app/build.gradle.kts =====")
          print(p.read_text())
          PY

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Show Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Soberi-Kartinku-APK
          path: project/app/build/outputs/apk/debug/*.apk
