name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q soberi-kartinku-android.zip -d project

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Force Java and Kotlin JVM 17
        working-directory: project
        run: |
          cat > jvm-fix.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.withType(KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        working-directory: project
        run: |
          gradle -I jvm-fix.gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soberi-Kartinku-APK
          path: project/app/build/outputs/apk/debug/*.apk
