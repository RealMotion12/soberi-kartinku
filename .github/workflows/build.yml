name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q ./*.zip -d project

      - name: Fix Java and Kotlin JVM targets
        working-directory: project
        run: |
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 | while IFS= read -r -d '' file; do
            sed -i 's/JavaVersion.VERSION_17/JavaVersion.VERSION_1_8/g' "$file"
            sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_1_8/g' "$file"
            sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']17["'\'']/jvmTarget = "1.8"/g' "$file"
            sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "1.8"/g' "$file"
          done

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soberi-Kartinku-APK
          path: project/app/build/outputs/apk/**/*.apk
