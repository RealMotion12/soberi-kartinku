name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q soberi-kartinku-android.zip -d project

      - name: Verify project JVM settings
        working-directory: project
        run: |
          echo "===== app/build.gradle.kts ====="
          cat app/build.gradle.kts
          echo "===== gradle.properties ====="
          cat gradle.properties

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Soberi-Kartinku-APK
          path: project/app/build/outputs/apk/debug/*.apk
