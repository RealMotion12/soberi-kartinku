name: Build ParkControl APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q soberi-kartinku-android.zip -d project

      - name: Configure Android project
        working-directory: project
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.realmotion12.soberikartinku"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.realmotion12.soberikartinku"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 20
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)

              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          EOF

      - name: Replace MainActivity
        working-directory: project
        run: |
          cat > app/src/main/java/com/realmotion12/soberikartinku/MainActivity.kt <<'EOF'
          package com.realmotion12.soberikartinku

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import kotlin.math.roundToInt

          data class Car(
              var brand: String,
              var model: String,
              var plate: String,
              var mileage: String,
              var status: String = "На линии",
              var insurance: String = "",
              var service: String = "",
              var expenses: Int = 0
          )

          class MainActivity : Activity() {

              private lateinit var root: LinearLayout
              private lateinit var content: LinearLayout

              private val cars = mutableListOf<Car>()

              private val prefs by lazy {
                  getSharedPreferences("park_control", Context.MODE_PRIVATE)
              }

              private val bg = Color.rgb(9, 11, 16)
              private val surface = Color.rgb(18, 21, 28)
              private val surface2 = Color.rgb(24, 28, 36)
              private val white = Color.rgb(245, 247, 250)
              private val secondary = Color.rgb(145, 151, 164)
              private val green = Color.rgb(65, 220, 137)
              private val blue = Color.rgb(91, 126, 255)
              private val purple = Color.rgb(151, 104, 255)
              private val orange = Color.rgb(255, 174, 72)
              private val red = Color.rgb(255, 91, 105)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = bg
                  window.navigationBarColor = bg

                  loadCars()
                  createRoot()
                  showDashboard()
              }

              private fun createRoot() {
                  root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(bg)

                  val scroll = ScrollView(this)
                  scroll.isFillViewport = true

                  content = LinearLayout(this)
                  content.orientation = LinearLayout.VERTICAL
                  content.setPadding(dp(18), dp(8), dp(18), dp(110))

                  scroll.addView(content)

                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  root.addView(createBottomBar())

                  setContentView(root)
              }

              private fun createBottomBar(): View {
                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.gravity = Gravity.CENTER
                  bar.setPadding(dp(8), dp(8), dp(8), dp(12))
                  bar.setBackgroundColor(Color.rgb(14, 17, 23))

                  val home = navItem("⌂", "Обзор")
                  val carsButton = navItem("🚗", "Авто")
                  val more = navItem("•••", "Ещё")

                  home.setOnClickListener { showDashboard() }
                  carsButton.setOnClickListener { showCars() }
                  more.setOnClickListener { showMore() }

                  bar.addView(home, weightParams())
                  bar.addView(carsButton, weightParams())
                  bar.addView(more, weightParams())

                  return bar
              }

              private fun navItem(icon: String, title: String): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.gravity = Gravity.CENTER
                  box.setPadding(0, dp(4), 0, dp(4))

                  val i = label(icon, 22, white, true)
                  i.gravity = Gravity.CENTER

                  val t = label(title, 11, secondary, false)
                  t.gravity = Gravity.CENTER

                  box.addView(i)
                  box.addView(t)

                  return box
              }

              private fun showDashboard() {
                  content.removeAllViews()

                  val header = LinearLayout(this)
                  header.gravity = Gravity.CENTER_VERTICAL

                  val titleBox = LinearLayout(this)
                  titleBox.orientation = LinearLayout.VERTICAL

                  titleBox.addView(
                      label("ПАРККОНТРОЛЬ", 22, white, true)
                  )

                  titleBox.addView(
                      label("Контроль автопарка", 13, secondary)
                  )

                  header.addView(
                      titleBox,
                      LinearLayout.LayoutParams(0, -2, 1f)
                  )

                  val add = roundButton("+")
                  add.setOnClickListener { editCar(-1) }

                  header.addView(add)

                  content.addView(
                      header,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(20)
                      }
                  )

                  val total = cars.size
                  val line = cars.count { it.status == "На линии" }
                  val repair = cars.count { it.status == "В ремонте" }
                  val idle = cars.count { it.status == "Простой" }

                  val hero = modernCard()

                  hero.setPadding(dp(22), dp(22), dp(22), dp(22))

                  hero.addView(
                      label("АВТОМОБИЛИ", 12, secondary, true)
                  )

                  hero.addView(
                      label(total.toString(), 50, white, true)
                  )

                  hero.addView(
                      label("в вашем автопарке", 14, secondary)
                  )

                  val progress = LinearLayout(this)
                  progress.orientation = LinearLayout.HORIZONTAL
                  progress.setPadding(0, dp(20), 0, 0)

                  val percent = if (total > 0) {
                      ((line.toDouble() / total) * 100).roundToInt()
                  } else 0

                  progress.addView(
                      label("$percent%", 18, green, true),
                      LinearLayout.LayoutParams(0, -2, 1f)
                  )

                  progress.addView(
                      label("на линии", 13, secondary),
                      LinearLayout.LayoutParams(-2, -2)
                  )

                  hero.addView(progress)

                  val lineBar = ProgressBar(
                      this,
                      null,
                      android.R.attr.progressBarStyleHorizontal
                  )

                  lineBar.max = 100
                  lineBar.progress = percent
                  lineBar.progressTintList =
                      android.content.res.ColorStateList.valueOf(green)

                  hero.addView(
                      lineBar,
                      LinearLayout.LayoutParams(-1, dp(5)).apply {
                          topMargin = dp(10)
                      }
                  )

                  content.addView(
                      hero,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(14)
                      }
                  )

                  val stats = LinearLayout(this)
                  stats.orientation = LinearLayout.HORIZONTAL

                  stats.addView(
                      statCard("●", line.toString(), "На линии", green),
                      LinearLayout.LayoutParams(0, -2, 1f).apply {
                          marginEnd = dp(5)
                      }
                  )

                  stats.addView(
                      statCard("🔧", repair.toString(), "Ремонт", orange),
                      LinearLayout.LayoutParams(0, -2, 1f).apply {
                          marginStart = dp(5)
                          marginEnd = dp(5)
                      }
                  )

                  stats.addView(
                      statCard("○", idle.toString(), "Простой", secondary),
                      LinearLayout.LayoutParams(0, -2, 1f).apply {
                          marginStart = dp(5)
                      }
                  )

                  content.addView(
                      stats,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(14)
                      }
                  )

                  val attention = modernCard()
                  attention.setPadding(dp(20), dp(20), dp(20), dp(20))

                  attention.addView(
                      label("ТРЕБУЕТ ВНИМАНИЯ", 13, secondary, true)
                  )

                  val repairCount = repair
                  val docs = cars.count { it.insurance.isNotBlank() }
                  val service = cars.count { it.service.isNotBlank() }

                  if (repairCount == 0 && docs == 0 && service == 0) {
                      attention.addView(
                          label(
                              "Всё под контролем",
                              18,
                              green,
                              true
                          )
                      )

                      attention.addView(
                          label(
                              "Нет активных предупреждений",
                              13,
                              secondary
                          )
                      )
                  } else {
                      if (repairCount > 0) {
                          attention.addView(
                              alertRow(
                                  "🔧",
                                  "$repairCount автомобилей в ремонте",
                                  orange
                              )
                          )
                      }

                      if (docs > 0) {
                          attention.addView(
                              alertRow(
                                  "📄",
                                  "$docs автомобилей — документы",
                                  orange
                              )
                          )
                      }

                      if (service > 0) {
                          attention.addView(
                              alertRow(
                                  "⚙",
                                  "$service автомобилей — ТО",
                                  orange
                              )
                          )
                      }
                  }

                  content.addView(
                      attention,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(14)
                      }
                  )

                  content.addView(
                      sectionTitle("БЫСТРЫЙ ДОСТУП")
                  )

                  val carsCard = actionCard(
                      "🚗",
                      "Автомобили",
                      "$total машин"
                  )

                  carsCard.setOnClickListener {
                      showCars()
                  }

                  content.addView(
                      carsCard,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(10)
                      }
                  )

                  val problemsCard = actionCard(
                      "⚠",
                      "Проблемы",
                      "${repair + docs + service} требуют внимания"
                  )

                  problemsCard.setOnClickListener {
                      showProblems()
                  }

                  content.addView(
                      problemsCard,
                      LinearLayout.LayoutParams(-1, -2)
                  )
              }

              private fun showCars() {
                  content.removeAllViews()

                  val header = LinearLayout(this)
                  header.gravity = Gravity.CENTER_VERTICAL

                  val title = LinearLayout(this)
                  title.orientation = LinearLayout.VERTICAL

                  title.addView(
                      label("Автомобили", 28, white, true)
                  )

                  title.addView(
                      label("${cars.size} автомобилей", 13, secondary)
                  )

                  header.addView(
                      title,
                      LinearLayout.LayoutParams(0, -2, 1f)
                  )

                  val add = roundButton("+")
                  add.setOnClickListener { editCar(-1) }

                  header.addView(add)

                  content.addView(
                      header,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(18)
                      }
                  )

                  val search = EditText(this)
                  search.hint = "Поиск по марке или госномеру"
                  search.setHintTextColor(secondary)
                  search.setTextColor(white)
                  search.textSize = 14f
                  search.setSingleLine()
                  search.setPadding(dp(18), 0, dp(18), 0)
                  search.background = roundedDrawable(surface2, 18)

                  content.addView(
                      search,
                      LinearLayout.LayoutParams(-1, dp(54)).apply {
                          bottomMargin = dp(14)
                      }
                  )

                  val filters = LinearLayout(this)
                  filters.orientation = LinearLayout.HORIZONTAL

                  val all = filterButton("Все")
                  val active = filterButton("На линии")
                  val repair = filterButton("Ремонт")
                  val idle = filterButton("Простой")

                  filters.addView(all, weightParams())
                  filters.addView(active, weightParams())
                  filters.addView(repair, weightParams())
                  filters.addView(idle, weightParams())

                  content.addView(
                      filters,
                      LinearLayout.LayoutParams(-1, dp(44)).apply {
                          bottomMargin = dp(14)
                      }
                  )

                  val list = LinearLayout(this)
                  list.orientation = LinearLayout.VERTICAL

                  fun refresh(filter: String, query: String = "") {
                      list.removeAllViews()

                      cars.filter { car ->
                          val filterOk = when (filter) {
                              "На линии" -> car.status == "На линии"
                              "Ремонт" -> car.status == "В ремонте"
                              "Простой" -> car.status == "Простой"
                              else -> true
                          }

                          val queryOk =
                              query.isBlank() ||
                              car.brand.contains(query, true) ||
                              car.model.contains(query, true) ||
                              car.plate.contains(query, true)

                          filterOk && queryOk
                      }.forEachIndexed { _, car ->

                          val originalIndex = cars.indexOf(car)

                          list.addView(
                              carCard(car) {
                                  carScreen(originalIndex)
                              },
                              LinearLayout.LayoutParams(-1, -2).apply {
                                  bottomMargin = dp(10)
                              }
                          )
                      }
                  }

                  all.setOnClickListener { refresh("Все") }
                  active.setOnClickListener { refresh("На линии") }
                  repair.setOnClickListener { refresh("Ремонт") }
                  idle.setOnClickListener { refresh("Простой") }

                  search.addTextChangedListener(
                      object : android.text.TextWatcher {
                          override fun beforeTextChanged(
                              s: CharSequence?,
                              start: Int,
                              count: Int,
                              after: Int
                          ) {}

                          override fun onTextChanged(
                              s: CharSequence?,
                              start: Int,
                              before: Int,
                              count: Int
                          ) {
                              refresh("Все", s?.toString() ?: "")
                          }

                          override fun afterTextChanged(
                              s: android.text.Editable?
                          ) {}
                      }
                  )

                  content.addView(list)

                  refresh("Все")
              }

              private fun carScreen(index: Int) {
                  val car = cars[index]

                  content.removeAllViews()

                  val back = smallButton("‹  Автомобили")
                  back.setOnClickListener { showCars() }

                  content.addView(back)

                  content.addView(
                      label(
                          "${car.brand} ${car.model}",
                          29,
                          white,
                          true
                      ),
                      LinearLayout.LayoutParams(-1, -2).apply {
                          topMargin = dp(14)
                      }
                  )

                  content.addView(
                      label(car.plate, 16, secondary),
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(18)
                      }
                  )

                  val statusColor = statusColor(car.status)

                  val statusCard = modernCard()
                  statusCard.setPadding(dp(20), dp(20), dp(20), dp(20))

                  statusCard.addView(
                      label("ТЕКУЩИЙ СТАТУС", 12, secondary, true)
                  )

                  statusCard.addView(
                      label(
                          "●  ${car.status}",
                          21,
                          statusColor,
                          true
                      )
                  )

                  content.addView(
                      statusCard,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(12)
                      }
                  )

                  val mileage = infoCard(
                      "ПРОБЕГ",
                      if (car.mileage.isBlank()) "—" else "${car.mileage} км"
                  )

                  val expense = infoCard(
                      "РАСХОДЫ",
                      "${car.expenses} ₽"
                  )

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL

                  row.addView(
                      mileage,
                      LinearLayout.LayoutParams(0, -2, 1f).apply {
                          marginEnd = dp(5)
                      }
                  )

                  row.addView(
                      expense,
                      LinearLayout.LayoutParams(0, -2, 1f).apply {
                          marginStart = dp(5)
                      }
                  )

                  content.addView(
                      row,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(12)
                      }
                  )

                  val docs = modernCard()
                  docs.setPadding(dp(20), dp(20), dp(20), dp(20))

                  docs.addView(
                      label("КОНТРОЛЬ", 12, secondary, true)
                  )

                  docs.addView(
                      infoLine(
                          "ОСАГО",
                          if (car.insurance.isBlank())
                              "Не указано"
                          else
                              car.insurance
                      )
                  )

                  docs.addView(
                      infoLine(
                          "Следующее ТО",
                          if (car.service.isBlank())
                              "Не указано"
                          else
                              car.service
                      )
                  )

                  content.addView(
                      docs,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(12)
                      }
                  )

                  val edit = actionCard(
                      "✎",
                      "Редактировать",
                      "Изменить данные автомобиля"
                  )

                  edit.setOnClickListener {
                      editCar(index)
                  }

                  content.addView(
                      edit,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(10)
                      }
                  )

                  val status = actionCard(
                      "↻",
                      "Изменить статус",
                      "На линии · Ремонт · Простой"
                  )

                  status.setOnClickListener {
                      chooseStatus(index)
                  }

                  content.addView(status)
              }

              private fun editCar(index: Int) {
                  val existing =
                      if (index >= 0) cars[index] else null

                  content.removeAllViews()

                  val back = smallButton("‹  Назад")
                  back.setOnClickListener {
                      if (index >= 0) carScreen(index)
                      else showDashboard()
                  }

                  content.addView(back)

                  content.addView(
                      label(
                          if (index >= 0)
                              "Редактировать"
                          else
                              "Новый автомобиль",
                          28,
                          white,
                          true
                      ),
                      LinearLayout.LayoutParams(-1, -2).apply {
                          topMargin = dp(14)
                          bottomMargin = dp(20)
                      }
                  )

                  val brand = field("Марка", existing?.brand ?: "")
                  val model = field("Модель", existing?.model ?: "")
                  val plate = field("Госномер", existing?.plate ?: "")
                  val mileage = field("Пробег, км", existing?.mileage ?: "")
                  val insurance = field("ОСАГО до", existing?.insurance ?: "")
                  val service = field("Следующее ТО", existing?.service ?: "")
                  val expenses = field(
                      "Расходы, ₽",
                      existing?.expenses?.toString() ?: ""
                  )

                  listOf(
                      brand,
                      model,
                      plate,
                      mileage,
                      insurance,
                      service,
                      expenses
                  ).forEach {
                      content.addView(
                          it,
                          LinearLayout.LayoutParams(-1, dp(56)).apply {
                              bottomMargin = dp(10)
                          }
                      )
                  }

                  val save = actionCard(
                      "✓",
                      "Сохранить",
                      "Данные будут сохранены на устройстве"
                  )

                  save.setOnClickListener {

                      if (brand.text.toString().trim().isEmpty() ||
                          plate.text.toString().trim().isEmpty()
                      ) {
                          Toast.makeText(
                              this,
                              "Заполни марку и госномер",
                              Toast.LENGTH_SHORT
                          ).show()
                          return@setOnClickListener
                      }

                      val car = Car(
                          brand.text.toString().trim(),
                          model.text.toString().trim(),
                          plate.text.toString().trim(),
                          mileage.text.toString().trim(),
                          existing?.status ?: "На линии",
                          insurance.text.toString().trim(),
                          service.text.toString().trim(),
                          expenses.text.toString().toIntOrNull() ?: 0
                      )

                      if (index >= 0) {
                          cars[index] = car
                          saveCars()
                          carScreen(index)
                      } else {
                          cars.add(car)
                          saveCars()
                          showCars()
                      }
                  }

                  content.addView(
                      save,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          topMargin = dp(8)
                      }
                  )

                  if (index >= 0) {
                      val delete = actionCard(
                          "⌫",
                          "Удалить автомобиль",
                          "Удаление нельзя отменить"
                      )

                      delete.setOnClickListener {
                          AlertDialog.Builder(this)
                              .setTitle("Удалить автомобиль?")
                              .setMessage(
                                  "${existing?.brand} ${existing?.model}\n${existing?.plate}"
                              )
                              .setNegativeButton("Отмена", null)
                              .setPositiveButton("Удалить") { _, _ ->
                                  cars.removeAt(index)
                                  saveCars()
                                  showCars()
                              }
                              .show()
                      }

                      content.addView(
                          delete,
                          LinearLayout.LayoutParams(-1, -2).apply {
                              topMargin = dp(10)
                          }
                      )
                  }
              }

              private fun chooseStatus(index: Int) {
                  val values = arrayOf(
                      "На линии",
                      "В ремонте",
                      "Простой"
                  )

                  AlertDialog.Builder(this)
                      .setTitle("Статус автомобиля")
                      .setItems(values) { _, which ->
                          cars[index].status = values[which]
                          saveCars()
                          carScreen(index)
                      }
                      .show()
              }

              private fun showProblems() {
                  content.removeAllViews()

                  content.addView(
                      label("Проблемы", 28, white, true)
                  )

                  content.addView(
                      label(
                          "Всё, что требует внимания",
                          14,
                          secondary
                      ),
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(20)
                      }
                  )

                  var count = 0

                  cars.forEachIndexed { index, car ->

                      if (car.status == "В ремонте") {
                          problemCard(
                              "🔧",
                              "${car.brand} ${car.model}",
                              car.plate,
                              "Автомобиль находится в ремонте",
                              orange
                          ) {
                              carScreen(index)
                          }
                          count++
                      }

                      if (car.insurance.isNotBlank()) {
                          problemCard(
                              "📄",
                              "${car.brand} ${car.model}",
                              car.plate,
                              "ОСАГО: ${car.insurance}",
                              orange
                          ) {
                              carScreen(index)
                          }
                          count++
                      }

                      if (car.service.isNotBlank()) {
                          problemCard(
                              "⚙",
                              "${car.brand} ${car.model}",
                              car.plate,
                              "ТО: ${car.service}",
                              orange
                          ) {
                              carScreen(index)
                          }
                          count++
                      }
                  }

                  if (count == 0) {
                      val empty = modernCard()
                      empty.gravity = Gravity.CENTER
                      empty.setPadding(
                          dp(20),
                          dp(35),
                          dp(20),
                          dp(35)
                      )

                      empty.addView(
                          label("✓", 42, green, true),
                          LinearLayout.LayoutParams(-1, -2)
                      )

                      empty.addView(
                          label(
                              "Всё под контролем",
                              20,
                              white,
                              true
                          )
                      )

                      empty.addView(
                          label(
                              "Активных проблем нет",
                              14,
                              secondary
                          )
                      )

                      content.addView(empty)
                  }
              }

              private fun showMore() {
                  content.removeAllViews()

                  content.addView(
                      label("Ещё", 28, white, true),
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(20)
                      }
                  )

                  val about = actionCard(
                      "ⓘ",
                      "О приложении",
                      "ПаркКонтроль · версия 2.0"
                  )

                  content.addView(about)

                  val expenses = actionCard(
                      "₽",
                      "Расходы",
                      "Общие расходы автопарка"
                  )

                  expenses.setOnClickListener {
                      showExpenses()
                  }

                  content.addView(
                      expenses,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          topMargin = dp(10)
                      }
                  )
              }

              private fun showExpenses() {
                  content.removeAllViews()

                  content.addView(
                      label("Расходы", 28, white, true),
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(18)
                      }
                  )

                  val total = cars.sumOf { it.expenses }

                  val totalCard = modernCard()
                  totalCard.setPadding(dp(22), dp(22), dp(22), dp(22))

                  totalCard.addView(
                      label("ОБЩИЕ РАСХОДЫ", 12, secondary, true)
                  )

                  totalCard.addView(
                      label("$total ₽", 38, white, true)
                  )

                  totalCard.addView(
                      label(
                          "по всем автомобилям",
                          13,
                          secondary
                      )
                  )

                  content.addView(
                      totalCard,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(14)
                      }
                  )

                  cars.filter { it.expenses > 0 }.forEach { car ->

                      val c = actionCard(
                          "🚗",
                          "${car.brand} ${car.model}",
                          "${car.plate}  ·  ${car.expenses} ₽"
                      )

                      content.addView(
                          c,
                          LinearLayout.LayoutParams(-1, -2).apply {
                              bottomMargin = dp(8)
                          }
                      )
                  }
              }

              private fun carCard(
                  car: Car,
                  click: () -> Unit
              ): View {

                  val c = modernCard()
                  c.setPadding(dp(18), dp(18), dp(18), dp(18))
                  c.setOnClickListener { click() }

                  val top = LinearLayout(this)
                  top.gravity = Gravity.CENTER_VERTICAL

                  val name = LinearLayout(this)
                  name.orientation = LinearLayout.VERTICAL

                  name.addView(
                      label(
                          "${car.brand} ${car.model}",
                          18,
                          white,
                          true
                      )
                  )

                  name.addView(
                      label(
                          car.plate,
                          13,
                          secondary
                      )
                  )

                  top.addView(
                      name,
                      LinearLayout.LayoutParams(0, -2, 1f)
                  )

                  val status = label(
                      "●",
                      17,
                      statusColor(car.status),
                      true
                  )

                  top.addView(status)

                  c.addView(top)

                  val bottom = LinearLayout(this)
                  bottom.gravity = Gravity.CENTER_VERTICAL
                  bottom.setPadding(0, dp(15), 0, 0)

                  bottom.addView(
                      label(
                          car.status,
                          13,
                          statusColor(car.status),
                          true
                      ),
                      LinearLayout.LayoutParams(0, -2, 1f)
                  )

                  bottom.addView(
                      label(
                          if (car.mileage.isBlank())
                              "Пробег —"
                          else
                              "${car.mileage} км",
                          13,
                          secondary
                      )
                  )

                  c.addView(bottom)

                  return c
              }

              private fun statCard(
                  icon: String,
                  number: String,
                  title: String,
                  color: Int
              ): View {

                  val c = modernCard()
                  c.setPadding(dp(13), dp(15), dp(13), dp(15))

                  c.addView(label(icon, 16, color, true))
                  c.addView(label(number, 24, white, true))
                  c.addView(label(title, 11, secondary))

                  return c
              }

              private fun infoCard(
                  title: String,
                  value: String
              ): View {

                  val c = modernCard()
                  c.setPadding(dp(16), dp(16), dp(16), dp(16))

                  c.addView(
                      label(title, 11, secondary, true)
                  )

                  c.addView(
                      label(value, 19, white, true)
                  )

                  return c
              }

              private fun actionCard(
                  icon: String,
                  title: String,
                  subtitle: String
              ): LinearLayout {

                  val c = modernCard()
                  c.orientation = LinearLayout.HORIZONTAL
                  c.gravity = Gravity.CENTER_VERTICAL
                  c.setPadding(dp(17), dp(16), dp(17), dp(16))

                  val iconBox = TextView(this)
                  iconBox.text = icon
                  iconBox.textSize = 22f
                  iconBox.gravity = Gravity.CENTER
                  iconBox.setTextColor(white)
                  iconBox.background = roundedDrawable(
                      Color.rgb(31, 36, 48),
                      16
                  )

                  c.addView(
                      iconBox,
                      LinearLayout.LayoutParams(dp(48), dp(48)).apply {
                          marginEnd = dp(14)
                      }
                  )

                  val textBox = LinearLayout(this)
                  textBox.orientation = LinearLayout.VERTICAL

                  textBox.addView(
                      label(title, 16, white, true)
                  )

                  textBox.addView(
                      label(subtitle, 12, secondary)
                  )

                  c.addView(
                      textBox,
                      LinearLayout.LayoutParams(0, -2, 1f)
                  )

                  c.addView(
                      label("›", 28, secondary)
                  )

                  return c
              }

              private fun alertRow(
                  icon: String,
                  text: String,
                  color: Int
              ): View {

                  val row = LinearLayout(this)
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(0, dp(13), 0, 0)

                  row.addView(
                      label(icon, 18, color),
                      LinearLayout.LayoutParams(dp(32), -2)
                  )

                  row.addView(
                      label(text, 14, white)
                  )

                  return row
              }

              private fun problemCard(
                  icon: String,
                  title: String,
                  plate: String,
                  info: String,
                  color: Int,
                  click: () -> Unit
              ) {

                  val c = modernCard()
                  c.setPadding(dp(18), dp(18), dp(18), dp(18))
                  c.setOnClickListener { click() }

                  c.addView(
                      label("$icon  $title", 17, white, true)
                  )

                  c.addView(
                      label(plate, 13, secondary)
                  )

                  c.addView(
                      label(info, 14, color, true)
                  )

                  content.addView(
                      c,
                      LinearLayout.LayoutParams(-1, -2).apply {
                          bottomMargin = dp(10)
                      }
                  )
              }

              private fun infoLine(
                  title: String,
                  value: String
              ): View {

                  val row = LinearLayout(this)
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(0, dp(12), 0, dp(2))

                  row.addView(
                      label(title, 13, secondary),
                      LinearLayout.LayoutParams(0, -2, 1f)
                  )

                  row.addView(
                      label(value, 14, white, true)
                  )

                  return row
              }

              private fun sectionTitle(title: String): View {
                  return label(
                      title,
                      12,
                      secondary,
                      true
                  ).apply {
                      setPadding(
                          dp(2),
                          dp(3),
                          dp(2),
                          dp(10)
                      )
                  }
              }

              private fun filterButton(title: String): Button {
                  val b = Button(this)
                  b.text = title
                  b.textSize = 11f
                  b.setTextColor(white)
                  b.setAllCaps(false)
                  b.background = roundedDrawable(
                      surface2,
                      14
                  )
                  return b
              }

              private fun field(
                  hint: String,
                  value: String
              ): EditText {

                  val e = EditText(this)
                  e.hint = hint
                  e.setText(value)
                  e.textSize = 14f
                  e.setSingleLine(true)
                  e.setTextColor(white)
                  e.setHintTextColor(secondary)
                  e.setPadding(dp(18), 0, dp(18), 0)
                  e.background = roundedDrawable(surface2, 17)

                  return e
              }

              private fun roundButton(
                  text: String
              ): TextView {

                  val v = TextView(this)
                  v.text = text
                  v.textSize = 25f
                  v.gravity = Gravity.CENTER
                  v.setTextColor(white)
                  v.background = roundedDrawable(blue, 17)

                  return v
              }

              private fun smallButton(
                  text: String
              ): Button {

                  val b = Button(this)
                  b.text = text
                  b.textSize = 13f
                  b.setTextColor(secondary)
                  b.setAllCaps(false)
                  b.background = ColorDrawableCompat.transparent()

                  return b
              }

              private fun modernCard(): LinearLayout {
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.VERTICAL
                  c.background = roundedDrawable(surface, 22)
                  return c
              }

              private fun label(
                  text: String,
                  size: Int,
                  color: Int,
                  bold: Boolean = false
              ): TextView {

                  val v = TextView(this)
                  v.text = text
                  v.textSize = size.toFloat()
                  v.setTextColor(color)

                  if (bold) {
                      v.typeface = Typeface.create(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                      )
                  }

                  return v
              }

              private fun statusColor(
                  status: String
              ): Int {
                  return when (status) {
                      "На линии" -> green
                      "В ремонте" -> orange
                      else -> secondary
                  }
              }

              private fun roundedDrawable(
                  color: Int,
                  radius: Int
              ): GradientDrawable {

                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radius).toFloat()
                  }
              }

              private fun weightParams(): LinearLayout.LayoutParams {
                  return LinearLayout.LayoutParams(
                      0,
                      -1,
                      1f
                  ).apply {
                      marginStart = dp(3)
                      marginEnd = dp(3)
                  }
              }

              private fun dp(value: Int): Int {
                  return (
                      value *
                          resources.displayMetrics.density
                      ).roundToInt()
              }

              private fun saveCars() {
                  val editor = prefs.edit()
                  editor.clear()

                  editor.putInt("count", cars.size)

                  cars.forEachIndexed { i, car ->
                      editor.putString("brand_$i", car.brand)
                      editor.putString("model_$i", car.model)
                      editor.putString("plate_$i", car.plate)
                      editor.putString("mileage_$i", car.mileage)
                      editor.putString("status_$i", car.status)
                      editor.putString("insurance_$i", car.insurance)
                      editor.putString("service_$i", car.service)
                      editor.putInt("expenses_$i", car.expenses)
                  }

                  editor.apply()
              }

              private fun loadCars() {
                  val count = prefs.getInt("count", 0)

                  for (i in 0 until count) {
                      cars.add(
                          Car(
                              prefs.getString("brand_$i", "") ?: "",
                              prefs.getString("model_$i", "") ?: "",
                              prefs.getString("plate_$i", "") ?: "",
                              prefs.getString("mileage_$i", "") ?: "",
                              prefs.getString(
                                  "status_$i",
                                  "На линии"
                              ) ?: "На линии",
                              prefs.getString(
                                  "insurance_$i",
                                  ""
                              ) ?: "",
                              prefs.getString(
                                  "service_$i",
                                  ""
                              ) ?: "",
                              prefs.getInt(
                                  "expenses_$i",
                                  0
                              )
                          )
                      )
                  }
              }

              private object ColorDrawableCompat {
                  fun transparent(): android.graphics.drawable.ColorDrawable {
                      return android.graphics.drawable.ColorDrawable(
                          Color.TRANSPARENT
                      )
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ParkControl-HiTech-APK
          path: project/app/build/outputs/apk/debug/*.apk
