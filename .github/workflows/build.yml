name: Build ParkControl APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare ParkControl project
        run: |
          rm -rf project
          mkdir project
          unzip -q ParkControl-v3-final.zip -d project

      - name: Configure Android project
        working-directory: project
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.realmotion12.soberikartinku"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.realmotion12.soberikartinku"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 30
                  versionName = "3.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)

              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          EOF

      - name: Build ParkControl APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload ParkControl APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ParkControl-APK-v3
          path: project/app/build/outputs/apk/debug/*.apk
